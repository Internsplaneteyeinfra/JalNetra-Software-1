<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mula–Mutha River · Sangam → Manjari</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --water:#0B171D; --panel:#101F27; --panel2:#142731; --line:#203945;
  --ink:#EAF1EF; --muted:#7F979D; --marigold:#E8A13D; --alert:#D14B3A;
  --ok:#3AA76D;
  --disp:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scrollbar-color:var(--line) var(--water)}
body{background:var(--water);color:var(--ink);font-family:var(--body);
     font-size:14px;line-height:1.5;min-height:100vh}
a{color:var(--marigold)}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px 48px}

/* ---------- header ---------- */
header{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;
       padding:22px 0 10px;border-bottom:1px solid var(--line)}
.wordmark{font-family:var(--disp);font-weight:700;font-size:30px;letter-spacing:.5px}
.wordmark span{color:var(--marigold)}
.tagline{color:var(--muted);font-size:13px}
.hdr-date{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--muted)}

/* ---------- honesty banner ---------- */
.banner{margin:14px 0 20px;padding:10px 14px;border:1px solid #6b5316;
        background:linear-gradient(90deg,#2a2210,#1c1a10);border-radius:6px;
        color:#f0d089;font-size:13px;display:flex;gap:10px;align-items:baseline}
.banner b{font-family:var(--mono);font-size:11px;letter-spacing:1px;
          border:1px solid #f0d089;border-radius:3px;padding:1px 6px;white-space:nowrap}

/* ---------- ribbon (signature) ---------- */
.ribbon-card{background:var(--panel);border:1px solid var(--line);
             border-radius:10px;padding:18px 18px 8px;margin-bottom:20px}
.ribbon-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.ribbon-head h2{font-family:var(--disp);font-weight:500;font-size:19px}
.ribbon-date{font-family:var(--mono);font-size:13px;color:var(--marigold)}
.time-step{display:inline-flex;align-items:center;gap:8px}
.ribbon-mode{font-family:var(--mono);font-size:11px;letter-spacing:1px;color:var(--muted);
             text-transform:uppercase;margin-left:auto}
.scrub-step{flex:0 0 auto;width:34px;height:34px;border:1px solid var(--line);
            background:var(--panel2);color:var(--ink);border-radius:6px;
            font-family:var(--mono);font-size:20px;line-height:1;cursor:pointer;
            display:inline-flex;align-items:center;justify-content:center;padding:0}
.scrub-step:hover:not(:disabled){border-color:var(--marigold);color:var(--marigold)}
.scrub-step:disabled{opacity:.35;cursor:not-allowed}
.scrub-step:focus-visible{outline:2px solid var(--marigold);outline-offset:2px}
#ribbonSvg{width:100%;height:auto;display:block}
.seg{cursor:pointer;transition:opacity .12s}
.seg:hover{opacity:.85}
.seg.sel{stroke:var(--marigold);stroke-width:2.5}
.scrub-row{display:flex;align-items:center;gap:14px;padding:10px 2px 12px}
input[type=range]{flex:1;accent-color:var(--marigold);height:22px}
.scrub-lab{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.legend{display:flex;gap:16px;flex-wrap:wrap;padding:4px 2px 10px;
        font-size:12px;color:var(--muted)}
.legend .sw{display:inline-block;width:14px;height:10px;border-radius:2px;
            vertical-align:-1px;margin-right:5px}
.legend .tex{border:1px dashed var(--muted);background:transparent}
.class-guide{margin-top:10px;padding:10px 12px;background:var(--panel2);
             border-radius:6px;font-size:12px;color:var(--muted);line-height:1.55}
.class-guide b{color:var(--ink);font-family:var(--mono);font-size:11px}
.class-guide div{margin-bottom:4px}
.class-guide div:last-child{margin-bottom:0}

/* ---------- grid ---------- */
.grid{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:16px}
@media(max-width:980px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.card h3{font-family:var(--disp);font-weight:500;font-size:16px;margin-bottom:10px}
.card h3 small{font-family:var(--body);color:var(--muted);font-weight:400;font-size:12px}

/* reach card */
.reach-name{font-family:var(--disp);font-size:20px;font-weight:500}
.reach-sub{color:var(--muted);font-size:12px;margin-bottom:10px}
.bignum{font-family:var(--mono);font-size:34px;font-weight:500;line-height:1.1}
.bignum small{font-size:14px;color:var(--muted)}
.interval{font-family:var(--mono);color:var(--muted);font-size:13px;margin-bottom:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}
.chip{font-family:var(--mono);font-size:11px;letter-spacing:.5px;border-radius:4px;
      padding:2px 8px;border:1px solid var(--line);color:var(--muted)}
.chip.cls{color:#08131a;font-weight:600;border:none}
.chip.tier{border-color:var(--marigold);color:var(--marigold)}
.chip.kml{border-color:#2dc0fb;color:#2dc0fb}
#chart{width:100%;height:auto;display:block;margin-top:4px}

/* alerts */
.alert-item{border-left:3px solid var(--muted);padding:8px 10px;margin-bottom:8px;
            background:var(--panel2);border-radius:0 6px 6px 0;font-size:13px}
.alert-item .meta{font-family:var(--mono);font-size:11px;color:var(--muted);
                  display:flex;gap:8px;margin-bottom:2px;flex-wrap:wrap}
.alert-item.likely-violation{border-color:var(--alert)}
.alert-item.warning{border-color:var(--marigold)}
.alert-item.advisory{border-color:#5b7d89}
.tierlab{text-transform:uppercase;letter-spacing:1px}
.empty{color:var(--muted);font-size:13px;padding:8px 0}

/* skill */
.metrics{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px;margin-bottom:12px}
.metrics td{padding:3px 6px;border-bottom:1px solid var(--line)}
.metrics td:last-child{text-align:right}
.metrics .lab{color:var(--muted)}
#skillSvg{width:100%;height:auto;display:block}
.foot{margin-top:26px;padding-top:12px;border-top:1px solid var(--line);
      color:var(--muted);font-size:12px}
.foot .charter{font-style:italic}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:2px solid var(--marigold);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="tagline" id="tagline">River organic-pollution twin · Mula–Mutha · Sangam → Manjari</div>
    <div class="hdr-date" id="hdrDate"></div>
  </header>

  <!-- ================= river ribbon (signature element) ================ -->
  <div class="ribbon-card">
    <div class="ribbon-head">
      <h2>The river, end to end</h2>
      <div class="time-step">
        <button type="button" class="scrub-step scrub-step-prev" id="scrubPrevTop"
                aria-label="Step back one hour">−</button>
        <span class="ribbon-date" id="scrubDate"></span>
        <button type="button" class="scrub-step scrub-step-next" id="scrubNextTop"
                aria-label="Step forward one hour">+</button>
      </div>
      <span class="ribbon-mode" id="scrubMode"></span>
    </div>
    <svg id="ribbonSvg" viewBox="0 0 1200 150" role="img"
         aria-label="River ribbon coloured by pollution class per reach"></svg>
    <div class="scrub-row">
      <span class="scrub-lab" id="scrubMin"></span>
      <button type="button" class="scrub-step scrub-step-prev" id="scrubPrev"
              aria-label="Step back one hour">−</button>
      <input type="range" id="scrub" min="0" max="0" value="0"
             aria-label="Time scrubber across history and forecast">
      <button type="button" class="scrub-step scrub-step-next" id="scrubNext"
              aria-label="Step forward one hour">+</button>
      <span class="scrub-lab" id="scrubMax"></span>
    </div>
    <div class="legend" id="legend"></div>
    <div class="class-guide" id="classGuide"></div>
  </div>

  <!-- ============================ panels =============================== -->
  <div class="grid">
    <div class="card" id="reachCard">
      <h3>Reach detail <small>— click any segment above</small></h3>
      <div id="reachBody"></div>
    </div>
    <div class="card">
      <h3>Alert inbox <small>— tiered, claim-ladder basis shown</small></h3>
      <div id="alerts"></div>
    </div>
    <div class="card">
      <h3>Accuracy Measure <small>— blind data, bad months included</small></h3>
      <table class="metrics" id="metricsTable"></table>
      <div id="skillCaption" style="font-size:12px;color:var(--muted);margin-bottom:4px">
        Forecast skill vs persistence (negative = worse)</div>
      <svg id="skillSvg" viewBox="0 0 340 120"></svg>
    </div>
  </div>
</div>

<script>
(async function(){
  const REFRESH_MS = 30 * 60 * 1000; // 30 minutes

  function timelineLabel(s){
    if(!s) return '';

    if(typeof s === 'string' && (s.includes('T') || s.includes(':'))){
      return s.replace('T',' ').slice(0,16);
    }
    return s;
  }

  function parseTimelineTs(s){
    if(!s) return null;
    const str = String(s);
    if(str.includes('T')){
      const [date, time] = str.split('T');
      const [y, m, d] = date.split('-').map(Number);
      const [hh, mm] = (time || '00:00').split(':').map(Number);
      return new Date(y, m - 1, d, hh, mm || 0, 0, 0);
    }
    const [y, m, d] = str.slice(0, 10).split('-').map(Number);
    return new Date(y, m - 1, d, 12, 0, 0, 0);
  }

  function indexForCurrentTime(){
    const now = new Date();
    const nowMs = now.getTime();
    const first = parseTimelineTs(timeline[0]);
    const last = parseTimelineTs(timeline[timeline.length - 1]);
    if(first && nowMs < first.getTime()) return 0;
    if(last && nowMs > last.getTime()) return timeline.length - 1;

    if(isHourly){
      const pad = n => String(n).padStart(2, '0');
      const exact = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}T${pad(now.getHours())}:00`;
      const hit = timeline.indexOf(exact);
      if(hit >= 0) return hit;
    } else {
      const pad = n => String(n).padStart(2, '0');
      const exact = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
      const hit = timeline.findIndex(t => String(t).slice(0, 10) === exact);
      if(hit >= 0) return hit;
    }

    let best = 0, bestDiff = Infinity;
    for(let i = 0; i < timeline.length; i++){
      const d = parseTimelineTs(timeline[i]);
      if(!d) continue;
      const diff = Math.abs(d.getTime() - nowMs);
      if(diff < bestDiff){ bestDiff = diff; best = i; }
    }
    return best;
  }

  function dayOf(i){ return String(timeline[i]).slice(0, 10); }
  function isTodayIndex(i){
    return i < histDates.length && dayOf(i) === D.generated;
  }

  function el(n,at){const e=document.createElementNS(NS,n);

      const seg=el('rect',{x:x(r.km[0])+1, y:cy-h/2, width:x(r.km[1])-x(r.km[0])-2,

    cities.forEach(([nm,km])=>{
      svg.appendChild(el('line',{x1:x(km),y1:cy-34,x2:x(km),y2:cy-24,
        stroke:'#5f777d','stroke-width':1,'class':'dyn'}));
      const t=el('text',{x:x(km),y:cy-40,'text-anchor':'middle',fill:'#9fb4b8',
        'font-size':'11px','font-family':'IBM Plex Sans','class':'dyn'});
      t.textContent=nm; svg.appendChild(t);
    });
    // date + mode labels
    const v0=valAt(D.reaches[0],i);
    document.getElementById('scrubDate').textContent=timelineLabel(timeline[i]);
    document.getElementById('scrubMode').textContent =
      v0.mode==='forecast' ? 'FORECAST (dashed)' :
      v0.mode==='today' ? 'TODAY — FUSED STATE' : 'FUSED HISTORY';
  }

  // legend + class descriptions (rebuilt on each data refresh)
  function buildLegend(){
    const lg=document.getElementById('legend');
    lg.innerHTML = CLS.map(c=>`<span><span class="sw" style="background:${COLORS[c]}"></span>
      Class ${c} (BOD — Biochemical Oxygen Demand ≤ ${c==='E'?'>'+EDGES[EDGES.length-1]:EDGES[CLS.indexOf(c)]} mg/L)</span>`).join('') +
    `<span><span class="sw" style="background:${COLORS.NA}"></span>NA (abstained)</span>
     <span><span class="sw" style="background:#2E7DD1;opacity:.75;outline:1px dashed #cfd">
     </span>dashed = forecast</span>
     <span><span class="sw tex"></span>hatched = no observation (prior only)</span>` +
    (D.kml_reach_id ? `<span><span class="sw" style="outline:2px solid #2dc0fb;background:transparent"></span>
     blue outline = your KML patch (${D.kml_reach_id})</span>` : '');
    document.getElementById('classGuide').innerHTML =
      '<div style="margin-bottom:6px;color:var(--ink);font-size:12px">Water quality classes (CPCB-style BOD bands)</div>' +
      CLS.map(c=>`<div><b>Class ${c}</b> — ${CLASS_DESC[c]||''}</div>`).join('') +
      `<div><b>NA</b> — insufficient evidence to assign a class (abstained)</div>`;
  }

  // scrubber (listener attached once)
  const scrub=document.getElementById('scrub');
  scrub.addEventListener('input',()=>updateAll(+scrub.value));

  const stepLabel = () => isHourly ? 'hour' : 'day';
  function updateStepButtons(){
    const atStart = scrubIdx <= 0;
    const atEnd = scrubIdx >= timeline.length - 1;
    const unit = stepLabel();
    document.querySelectorAll('.scrub-step-prev').forEach(btn=>{
      btn.disabled = atStart;
      btn.setAttribute('aria-label', `Step back one ${unit}`);
      btn.title = `Previous ${unit} (−)`;
    });
    document.querySelectorAll('.scrub-step-next').forEach(btn=>{
      btn.disabled = atEnd;
      btn.setAttribute('aria-label', `Step forward one ${unit}`);
      btn.title = `Next ${unit} (+)`;
    });
  }
  function stepTime(delta){
    const next = Math.max(0, Math.min(timeline.length - 1, scrubIdx + delta));
    if(next === scrubIdx) return;
    scrub.value = next;
    updateAll(next);
  }
  document.querySelectorAll('.scrub-step-prev').forEach(btn=>{
    btn.addEventListener('click', ()=>stepTime(-1));
  });
  document.querySelectorAll('.scrub-step-next').forEach(btn=>{
    btn.addEventListener('click', ()=>stepTime(1));
  });
  document.addEventListener('keydown', e=>{
    if(e.target.closest('input, textarea, select')) return;
    if(e.key === 'ArrowLeft'){ e.preventDefault(); stepTime(-1); }
    if(e.key === 'ArrowRight'){ e.preventDefault(); stepTime(1); }
  });

  function updateAll(i){
    scrubIdx = i;
    scrub.value = i;
    updateStepButtons();
    drawRibbon(i);
    renderReach();
    renderAlerts();
    renderSkill();
  }

  // ---------- reach card + chart -----------------------------------------
  function renderReach(){
    const r=D.reaches.find(q=>q.id===selected), v=valAt(r, scrubIdx);
    const vc=valAtCod(r, scrubIdx);
    const cls = (v.mode==='today' && !isHourly) ? r.today.cls : bandOf(v.p50);
    const clsColor=COLORS[cls]||COLORS.NA;
    const tier = v.mode==='today' ? r.today.tier : 'Estimated';
    const dateLabel = timeline[scrubIdx];
    const modeLabel = v.mode==='forecast' ? 'forecast' :
      v.mode==='today' ? 'today' : 'history';
    const vill = r.villages ? `<br>nearby villages: ${r.villages}` : '';
    const kmlChip = (D.kml_reach_id && r.id===D.kml_reach_id)
      ? '<span class="chip kml">KML PATCH</span>' : '';
    const codBlock = vc ? `
      <div class="bignum" style="font-size:26px;margin-top:10px">${vc.p50.toFixed(1)}
        <small>mg/L COD — Chemical Oxygen Demand (P50)</small></div>
      <div class="interval">COD 90% interval ${vc.p10.toFixed(1)} – ${vc.p90.toFixed(1)} mg/L</div>` : '';
    document.getElementById('reachBody').innerHTML=`
      <div class="reach-name">${r.name}</div>
      <div class="reach-sub">${r.id} · km ${r.km[0]}–${r.km[1]} · mean width ${r.width_m} m${vill}</div>
      <div class="reach-sub" style="margin-bottom:8px;color:var(--marigold)">${timelineLabel(dateLabel)} · ${modeLabel}${isHourly?' · hourly':''}</div>
      <div class="bignum">${v.p50.toFixed(1)} <small>mg/L BOD — Biochemical Oxygen Demand (P50)</small></div>
      <div class="interval">BOD 90% interval ${v.p10.toFixed(1)} – ${v.p90.toFixed(1)} mg/L</div>
      ${codBlock}
      <div class="chips">
        <span class="chip cls" style="background:${clsColor}">CLASS ${cls}</span>
        <span class="chip tier">${tier.toUpperCase()}</span>
        <span class="chip">support: ${v.support}</span>
        ${kmlChip}
      </div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:8px">${CLASS_DESC[cls]||'Class not assigned'}</div>
      <svg id="chart" viewBox="0 0 560 200"></svg>
      <div style="font-size:11px;color:var(--muted)">${histCount} ${histUnit} fused history · shaded = BOD 90% band ·
        solid = BOD · blue dashed = COD · marker = selected ${isHourly?'hour':'date'}</div>`;
    drawChart(r);
  }

  function drawChart(r){
    const c=document.getElementById('chart');
    const W=560,H=200,L=38,R=8,T=10,B=24;
    const p50=r.history.p50.concat(r.forecast.p50),
          p10=r.history.p10.concat(r.forecast.p10),
          p90=r.history.p90.concat(r.forecast.p90);
    const hasCod = r.history.cod_p50 && r.forecast.cod_p50;
    const cod50 = hasCod ? r.history.cod_p50.concat(r.forecast.cod_p50) : null;
    const n=p50.length, ymax=Math.max(...p90, ...(cod50||[]), EDGES[2])*1.1, ymin=0;
    const X=i=>L+i/(n-1)*(W-L-R), Y=v=>T+(1-(v-ymin)/(ymax-ymin))*(H-T-B);
    let s='';
    // class band guides (BOD limits)
    EDGES.forEach((e,i)=>{ if(e<ymax) s+=`<line x1="${L}" x2="${W-R}" y1="${Y(e)}" y2="${Y(e)}"
      stroke="${COLORS[CLS[i]]}" stroke-opacity=".35" stroke-dasharray="2 4"/>
      <text x="${W-R-2}" y="${Y(e)-3}" text-anchor="end" fill="${COLORS[CLS[i]]}"
      fill-opacity=".7" font-size="9" font-family="IBM Plex Mono">≤${e} ${CLS[i]}</text>`; });
    // BOD uncertainty band
    let band='M'+X(0)+' '+Y(p90[0]);
    for(let i=1;i<n;i++) band+=' L'+X(i)+' '+Y(p90[i]);
    for(let i=n-1;i>=0;i--) band+=' L'+X(i)+' '+Y(p10[i]);
    s+=`<path d="${band} Z" fill="#E8A13D" fill-opacity=".13"/>`;
    const seg=(arr,a,b,dash,stroke,width)=>{let d='M'+X(a)+' '+Y(arr[a]);
      for(let i=a+1;i<=b;i++)d+=' L'+X(i)+' '+Y(arr[i]);
      return `<path d="${d}" fill="none" stroke="${stroke}" stroke-width="${width||1.8}"
        ${dash?'stroke-dasharray="5 4" stroke-opacity=".9"':''}/>`;};
    // BOD median: solid history, dashed forecast
    s+=seg(p50,0,todayIdx,false,'#EAF1EF')+seg(p50,todayIdx,n-1,true,'#EAF1EF');
    // COD median (dashed orange)
    if(cod50){
      s+=seg(cod50,0,todayIdx,true,'#2dc0fb',1.4)+seg(cod50,todayIdx,n-1,true,'#2dc0fb',1.4);
    }
    // today divider
    s+=`<line x1="${X(todayIdx)}" x2="${X(todayIdx)}" y1="${T}" y2="${H-B}"
      stroke="#E8A13D" stroke-width="1" stroke-opacity=".55"/>
      <text x="${X(todayIdx)+3}" y="${T+9}" fill="#E8A13D" font-size="9"
      font-family="IBM Plex Mono" fill-opacity=".7">today</text>`;
    // selected timestamp marker
    s+=`<line x1="${X(scrubIdx)}" x2="${X(scrubIdx)}" y1="${T}" y2="${H-B}"
      stroke="#EAF1EF" stroke-width="1.5"/>
      <circle cx="${X(scrubIdx)}" cy="${Y(p50[scrubIdx])}" r="4" fill="#E8A13D" stroke="#0B171D" stroke-width="1.5"/>`;
    if(cod50){
      s+=`<circle cx="${X(scrubIdx)}" cy="${Y(cod50[scrubIdx])}" r="3.5" fill="#2dc0fb" stroke="#0B171D" stroke-width="1"/>`;
    }
    // axes
    s+=`<line x1="${L}" x2="${L}" y1="${T}" y2="${H-B}" stroke="#203945"/>
      <line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" stroke="#203945"/>`;
    [0,Math.round(ymax/2),Math.round(ymax)].forEach(v=>{
      s+=`<text x="${L-5}" y="${Y(v)+3}" text-anchor="end" fill="#7F979D"
        font-size="9" font-family="IBM Plex Mono">${v}</text>`;});
    s+=`<text x="${L-26}" y="${T+8}" fill="#7F979D" font-size="9"
      font-family="IBM Plex Mono">mg/L</text>`;
    c.innerHTML=s;
  }

  // ---------- alerts (date-aware) ------------------------------------------
  function alertsForDate(i){
    const date = timeline[i];
    // Alerts are stored with a date-only string (YYYY-MM-DD).
    // If timeline provides timestamps (hourly), match by the date prefix.
    const dateKey = (typeof date === 'string' && date.length >= 10) ? date.slice(0,10) : date;
    const mode = valAt(D.reaches[0], i).mode;
    const seen = new Set();
    const out = [];
    function add(a){
      const key = `${a.tier}|${a.reach_id}|${a.text}`;
      if(seen.has(key)) return;
      seen.add(key);
      out.push(a);
    }
    D.alerts
      .filter(a => a.date === date || a.date === dateKey)
      .forEach(add);
    if(mode === 'forecast'){
      D.reaches.forEach(r=>{
        const v = valAt(r, i);
        if(v.p50 > EDGES[2]){
          add({tier:'advisory', basis:'Estimated', reach_id:r.id, date,
            text:`Forecast BOD P50 ${v.p50.toFixed(1)} mg/L (P90 ${v.p90.toFixed(1)} mg/L)`});
        }
      });
    } else {
      D.reaches.forEach(r=>{
        const v = valAt(r, i);
        if(v.p10 > EDGES[1]){
          add({tier:'likely-violation', basis:'Estimated', reach_id:r.id, date,
            text:`Fused BOD P10 ${v.p10.toFixed(1)} mg/L exceeds bathing-class limit (≤ ${EDGES[1]} mg/L)`});
        }
      });
    }
    const order = {'likely-violation':0,'warning':1,'advisory':2};
    return out.sort((a,b)=>(order[a.tier]??9)-(order[b.tier]??9));
  }

  function renderAlerts(){
    const A=document.getElementById('alerts');
    const date = timeline[scrubIdx];
    const alerts = alertsForDate(scrubIdx);
    A.innerHTML = alerts.length ? alerts.map(a=>`
      <div class="alert-item ${a.tier}">
        <div class="meta"><span class="tierlab">${a.tier}</span>
          <span>[${a.basis}]</span><span>${a.reach_id}</span><span>${a.date}</span></div>
        ${a.text}</div>`).join('')
      : `<div class="empty">No alerts for ${date}. Scrub other dates to compare conditions across the river.</div>`;
  }

  // ---------- skill panel (date-aware) -------------------------------------
  function renderSkill(){
    const bm=D.blind_metrics||{}, mt=document.getElementById('metricsTable');
    const date = timeline[scrubIdx];
    const mode = valAt(D.reaches[0], scrubIdx).mode;
    const vals = D.reaches.map(r => valAt(r, scrubIdx));
    const cods = D.reaches.map(r => valAtCod(r, scrubIdx)).filter(Boolean);
    const avgBod = vals.reduce((s,v)=>s+v.p50,0) / vals.length;
    const avgCod = cods.length ? cods.reduce((s,v)=>s+v.p50,0) / cods.length : null;
    const bathingViol = vals.filter(v => v.p10 > EDGES[1]).length;
    const worst = vals.reduce((w,v)=>v.p50>w.p50?v:w, vals[0]);
    const worstReach = D.reaches.find(r => valAt(r, scrubIdx).p50 === worst.p50);
    let rows;

    if(mode === 'forecast'){
      const fcDay = forecastHorizon(scrubIdx);
      const sk = D.skill.find(s => s.day === fcDay) || D.skill[fcDay - 1] || {};
      rows = [
        ['Selected timestamp', timelineLabel(date)],
        ['Forecast horizon', `day ${fcDay}`],
        ['BOD (Biochemical Oxygen Demand) river mean P50 (mg/L)', avgBod],
        ...(avgCod!=null ? [['COD (Chemical Oxygen Demand) river mean P50 (mg/L)', avgCod]] : []),
        ['BOD RMSE — Root Mean Square Error (mg/L)', sk.rmse],
        ['BOD RMSE persistence baseline (mg/L)', sk.rmse_persistence],
        ['Skill vs persistence (1 − RMSE/RMSE₀)', sk.skill_vs_persistence],
        ['BOD 90% interval coverage (fraction in band)', sk.interval_coverage],
        ['BOD R² — Coefficient of Determination (blind holdout)', bm.bod?.r2],
        ['BOD class accuracy (blind holdout)', bm.bod?.class_accuracy],
        ['COD R² — Coefficient of Determination (blind holdout)', bm.cod?.r2],
        ['COD RMSE — Root Mean Square Error (mg/L, blind)', bm.cod?.rmse],
        ['COD 90% interval coverage (blind holdout)', bm.cod?.interval_coverage],
      ];
      if(skillCap) skillCap.textContent =
        `Forecast skill for day ${fcDay} at ${timelineLabel(date)} — river snapshot updates hourly; skill bars are daily horizons.`;
    } else {
      rows = [
        ['Selected timestamp', timelineLabel(date)],
        ['BOD (Biochemical Oxygen Demand) river mean P50 (mg/L)', avgBod],
        ...(avgCod!=null ? [['COD (Chemical Oxygen Demand) river mean P50 (mg/L)', avgCod]] : []),
        ['Reaches above bathing BOD limit (P10 > 3 mg/L)', bathingViol],
        ['Highest BOD reach', `${worstReach.id} (${worst.p50.toFixed(1)} mg/L)`],
        ['BOD R² — Coefficient of Determination (blind holdout)', bm.bod?.r2],
        ['BOD RMSE — Root Mean Square Error (mg/L, blind)', bm.bod?.rmse],
        ['BOD 90% interval coverage (blind holdout)', bm.bod?.interval_coverage],
        ['BOD class accuracy (blind holdout)', bm.bod?.class_accuracy],
        ['BOD abstention rate (blind holdout)', bm.bod?.abstention_rate],
        ['COD R² — Coefficient of Determination (blind holdout)', bm.cod?.r2],
        ['COD RMSE — Root Mean Square Error (mg/L, blind)', bm.cod?.rmse],
        ['COD 90% interval coverage (blind holdout)', bm.cod?.interval_coverage],
        ['Blind validation pairs (BOD count)', bm.bod?.n],
      ];
      if(skillCap) skillCap.textContent =
        `River snapshot for ${timelineLabel(date)} — mean BOD/COD and reach counts change as you scrub${isHourly?' by hour':''}. Blind metrics are model-wide holdout scores.`;
    }
    mt.innerHTML = rows.map(([k,v])=>`<tr><td class="lab">${k}</td><td>${fmt(v)}</td></tr>`).join('');

    const sk=document.getElementById('skillSvg');
    const sW=340,sH=120,zero=62;
    const nSkill=D.skill.length, gap=Math.max(4,(sW-34)/nSkill);
    const bw=Math.min(24,gap-4);
    const hiDay = mode === 'forecast' ? forecastHorizon(scrubIdx) : null;
    let ss=`<line x1="14" x2="${sW-6}" y1="${zero}" y2="${zero}" stroke="#203945"/>`;
    D.skill.forEach((row,i)=>{
      const v=row.skill_vs_persistence, h=Math.min(Math.abs(v)*90,52);
      const up=v>=0, y=up?zero-h:zero;
      const bx=20+i*gap;
      const active = hiDay === row.day;
      ss+=`<rect x="${bx}" y="${y}" width="${bw}" height="${Math.max(h,1)}" rx="2"
        fill="${up?'#E8A13D':'#D14B3A'}" opacity="${active?1:0.45}"
        stroke="${active?'#EAF1EF':'none'}" stroke-width="${active?1.5:0}"/>
        <text x="${bx+bw/2}" y="${up?y-4:y+h+11}" text-anchor="middle"
          fill="${up?'#E8A13D':'#D14B3A'}" font-size="8" font-family="IBM Plex Mono"
          opacity="${active?1:0.55}">
          ${(v>=0?'+':'')+v.toFixed(2)}</text>
        <text x="${bx+bw/2}" y="${sH-4}" text-anchor="middle" fill="${active?'#EAF1EF':'#7F979D'}"
          font-size="8" font-family="IBM Plex Mono">d${row.day}</text>`;
    });
    sk.innerHTML=ss;
  }

  // ---------- go -----------------------------------------------------------
  applyData(D, null);
  scheduleRefresh();
})();
</script>
</body>
</html>
